# Golden queries for retrieval benchmarking (npm run eval:retrieval).
# A result matches a relevant entry when its sourcePath equals `path` and, when given,
# its methodName equals `method` (case-insensitive) and its heading contains `heading`.
# List every acceptable variant (for example Global and Scoped API pages) as separate entries.
